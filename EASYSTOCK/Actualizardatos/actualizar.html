 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<body>
  <div class="sidebar">
    <div class="menu-icon">&#9776;
    </div>
    <div class="user-info">Felipe Casanova

    <div class="menu">
      <span>

 <a href="../index.html" class="menu-itemcom"><i class="fas fa-user-cog"></i> Mantención de usuarios</a>

     <span>
      <a href="../index.html" class="menu-itemlog"><i class="fas fa-cogs"></i> Configuración</a>
      </span>
      </div>

    <div class="main-content">
<a href="../index.html">
         <img class="contenedor-m" src="../image/icono.png" alt="Logo">
    </a>

    <h1>Ferretería El Grillo</h1>
    <h4>Administrador</h4>

    <section class="Usuarios">
    <div class="GestionUsuarios">
       <h3><i class="fas fa-user-check"></i> Actualizar Datos</h3>
    </div>

  <form>
    <fieldset>
  <legend>Información Personal</legend>
  <div class="grid-2">
    <div>
      <label>Nombre completo</label>
      <input type="text" name="nombre_completo" placeholder="Nombre completo" required>
    </div>
    <div>
      <label>Tipo de identificación</label>
      <select name="tipo_identificacion" required>
        <option value="">Seleccione...</option>
        <option value="cc">Cédula de Ciudadanía</option>
        <option value="ce">Cédula de Extranjería</option>
      </select>
    </div>
    <div>
      <label>Número de identificación</label>
      <input type="text" name="numero_identificacion" placeholder="Número de identificación" required>
    </div>
    <div>
      <label>Fecha de nacimiento</label>
      <input type="date" name="fecha_nacimiento">
    </div>
    <div>
      <label>Dirección</label>
      <input type="text" name="direccion" placeholder="Dirección del empleado">
    </div>
    <div>
      <label>Teléfono</label>
      <input type="tel" name="telefono" placeholder="Teléfono">
    </div>
  </div>
</fieldset>

<fieldset>
  <legend>Información Laboral</legend>
  <div class="grid-2">
    <div>
      <label>Cargo</label>
      <input type="text" name="cargo" placeholder="Cargo">
    </div>
    <div>
      <label>Contraseña</label>
      <input type="password" name="contrasena" placeholder="Contraseña">
    </div>
    <div>
      <label>Departamento</label>
      <select name="departamento">
        <option value="">Seleccione...</option>
        <option value="administrativo">Administrativo</option>
        <option value="comercial">Comercial</option>
        <option value="logistico">Logístico</option>
      </select>
    </div>
    <div>
      <label>Fecha de ingreso</label>
      <input type="date" name="fecha_ingreso">
    </div>
  </div>

  <label>Permisos</label>
  <div class="permisos">
    <label><input type="checkbox" name="permisos" value="operaciones"> Operaciones</label>
    <label><input type="checkbox" name="permisos" value="ventas"> Ventas</label>
    <label><input type="checkbox" name="permisos" value="inventario"> Inventario</label>
    <label><input type="checkbox" name="permisos" value="reportes"> Reportes</label>
    <label><input type="checkbox" name="permisos" value="proveedores"> Proveedores</label>
    <label><input type="checkbox" name="permisos" value="clientes"> Clientes</label>
    <label><input type="checkbox" name="permisos" value="configuracion"> Configuración</label>
    <label><input type="checkbox" name="permisos" value="usuarios"> Mantención de usuarios</label>
    <label><input type="checkbox" name="permisos" value="actualizar"> Actualizar datos</label>
  </div>
</fieldset>

<div class="form-buttons">
  <button type="submit" class="btn-guardar">
    <i class="fas fa-save"></i> Guardar Cliente
  </button>
  <button type="button" class="btn-cancelar" onclick="history.back()">
    <i class="fas fa-times"></i> Cancelar
  </button>
</div>

</form>
</body>
</html>
